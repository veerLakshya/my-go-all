<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth 2.1 Lab | Keycloak + Go</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #f0f0f0;
            --accent-color: #007bff;
            --accent-hover: #0056b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 500px;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        p {
            color: #aaa;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn-login {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 32px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn-login:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 Identity Masterclass</h1>
        <p>Demonstrating the <strong>Authorization Code Flow with PKCE</strong> using Go, Keycloak, and MariaDB.</p>

        <a href="/login" class="btn-login">Login with Keycloak</a>

        <div class="footer-note">
            Protocol: OAuth 2.1 (OIDC) <br>
            Environment: Debian Linux + Go + MongoDB
        </div>
    </div>
</body>

</html>
